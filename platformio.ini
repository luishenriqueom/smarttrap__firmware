[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=1
    -DFW_MODE_INFER=0
lib_deps =
    espressif/esp32-camera @ ^2.0.4
    sandeepmistry/LoRa @ ^0.8.0

; Segundo binário, publicado quando o modelo Edge Impulse entrar em src/inference.cpp.
[env:esp32cam_infer]
extends = env:esp32cam
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DFW_VERSION=1
    -DFW_MODE_INFER=1
lib_deps =
    ${env:esp32cam.lib_deps}
    nickjgniklu/ESP_TF @ ^2.1.2
